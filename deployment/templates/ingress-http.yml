{{- if .Values.ingress.enabled -}}
{{- $fullName := include "ucp-member-search-ui.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: 
  name: {{ $fullName }}-ingress-http
  labels:
    {{- include "ucp-member-search-ui.labels" . | nindent 4 }}
  
  # Adds ingress annotations to the resource if defined in values.yaml
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  ingressClssName: nginx

  rules:
    - host: {{ .Values.ingress.host.ctrPlatform.http }}
      http:
        paths:
          - pathType: Prefix
            path: {{ .Values.ingress.paths.appPath }}
            backend:
              service:
                name: {{ $fullName }}-svc
                port:
                  number: {{ .Values.service.port }}
{{- end }}