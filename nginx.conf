server {
    listen 3000;
    server_name localhost;

    # Redirect bare root to the app sub-path
    location = / {
        return 301 /ucp-client-match-ui/;
    }

    # ── Live API Proxy ────────────────────────────────────────────────────────
    # location /api/ {
    #     proxy_pass         https://claims-poc.dev.multiplan.com/claimsearchservice/api/;
    #     proxy_ssl_server_name on;
    #     proxy_set_header   Host              claims-poc.dev.multiplan.com;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    #     proxy_connect_timeout 180s;
    #     proxy_send_timeout    180s;
    #     proxy_read_timeout    180s;
    # }

    # ── SPA Routing ───────────────────────────────────────────────────────────
    # try_files serves the exact file/dir if it exists, otherwise falls back
    # to index.html so React Router handles client-side navigation.
    # Without this fallback, every browser refresh on a deep route returns 404.
    location /ucp-client-match-ui {
        root  /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /ucp-client-match-ui/index.html;

        proxy_connect_timeout 180s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # ── Error pages ───────────────────────────────────────────────────────────
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}